<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRESENSI ONLINE PAGI & PULANG - UPT SMP NEGERI 3 SUTOJAYAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #030712 100%);
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(56, 189, 248, 0.2);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --cyan-neon: #06b6d4;
      --cyan-glow: 0 0 15px rgba(6, 182, 212, 0.5);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 15px;
    }
    .container { max-width: 950px; margin: 0 auto; }
    .app-header { text-align: center; margin-bottom: 30px; }
    .app-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
      margin-bottom: 8px;
    }
    .app-subtitle { font-size: 0.9rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }
    .glass-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-neon), transparent);
    }
    .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
    .tab-btn {
      padding: 12px 28px; background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-dim);
      border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: all 0.3s ease;
    }
    .tab-btn:hover { border-color: var(--cyan-neon); color: #fff; }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
      border-color: var(--cyan-neon); color: #fff; box-shadow: var(--cyan-glow);
    }
    .section-title { font-size: 1.1rem; font-weight: 700; color: var(--cyan-neon); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .flex-gap { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .btn-class {
      padding: 10px 20px; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; color: var(--text-main); font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-class:hover { background: #334155; transform: translateY(-2px); }
    .btn-class.active {
      background: var(--cyan-neon); color: #030712; font-weight: 700; border-color: var(--cyan-neon); box-shadow: var(--cyan-glow);
    }
    .student-card {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 18px; border-radius: 12px; margin-bottom: 10px; gap: 12px;
    }
    .student-name { font-weight: 600; font-size: 0.95rem; }
    .action-group { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .action-buttons { display: flex; gap: 6px; }
    .btn-action { padding: 7px 12px; font-size: 0.78rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; letter-spacing: 0.5px; }
    .btn-absen { background: #10b981; color: #fff; }
    .btn-sakit { background: #f59e0b; color: #fff; }
    .btn-ijin { background: #3b82f6; color: #fff; }
    .btn-alpa { background: #ef4444; color: #fff; }
    .btn-pulang { background: #8b5cf6; color: #fff; }
    .btn-wa { background: #25d366; color: #fff; }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
    select, input {
      padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a; color: var(--text-main); outline: none; font-family: inherit;
    }
    select:focus, input:focus { border-color: var(--cyan-neon); }
    .stat-container { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .stat-box {
      flex: 1; min-width: 100px; background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; text-align: center;
    }
    .stat-title { font-size: 0.7rem; color: var(--text-dim); }
    .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px; text-align: left; font-size: 0.9rem; }
    th { background: rgba(30, 41, 59, 0.9); color: var(--cyan-neon); font-weight: 700; }
    tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .view-section { display: none; }
    .view-section.active { display: block; }
    
    /* HEADER CETAK RESMI */
    .print-header { display: none; text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #000; }
    .print-header h2 { font-size: 1.4rem; color: #000; text-transform: uppercase; font-weight: 800; }
    .print-header h4 { font-size: 1rem; color: #333; margin-top: 5px; font-weight: 600; }
    .print-header p { font-size: 0.85rem; color: #555; margin-top: 4px; }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }
      .app-header, .tabs, .glass-card:not(#rekap-result-card), .no-print { display: none !important; }
      .glass-card { border: none !important; box-shadow: none !important; background: transparent !important; padding: 0 !important; }
      .print-header { display: block !important; }
      table { width: 100% !important; border-collapse: collapse !important; }
      th, td { border: 1px solid #000 !important; color: #000 !important; padding: 8px !important; }
      th { background-color: #f1f5f9 !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-header">
      <h1 class="app-title">PRESENSI ONLINE PAGI & PULANG</h1>
      <div class="app-subtitle">UPT SMP NEGERI 3 SUTOJAYAN</div>
    </div>

    <div class="tabs no-print">
      <button class="tab-btn active" onclick="switchTab('input-view', this)">Input Presensi</button>
      <button class="tab-btn" onclick="switchTab('rekap-view', this)">Rekap & Cetak</button>
    </div>

    <!-- SEKSI 1: INPUT PRESENSI -->
    <div id="input-view" class="view-section active">
      <div class="glass-card">
        <div class="section-title">Pilih Kelas</div>
        <div class="flex-gap">
          <button class="btn-class" onclick="selectClass('7a', this)">7a</button>
          <button class="btn-class" onclick="selectClass('8a', this)">8a</button>
          <button class="btn-class" onclick="selectClass('8b', this)">8b</button>
          <button class="btn-class" onclick="selectClass('9a', this)">9a</button>
          <button class="btn-class" onclick="selectClass('9b', this)">9b</button>
        </div>
      </div>
      <div class="glass-card">
        <div class="section-title" id="class-title">Daftar Siswa</div>
        <div id="student-list"><p style="text-align: center; color: var(--text-dim); padding: 20px 0;">Silakan pilih kelas terlebih dahulu.</p></div>
      </div>
    </div>

    <!-- SEKSI 2: REKAP -->
    <div id="rekap-view" class="view-section">
      <div class="glass-card no-print">
        <div class="section-title">Filter Rekap Data & Rentang Waktu</div>
        <div class="flex-gap">
          <label>Kelas:</label>
          <select id="rekap-kelas">
            <option value="7a">7a</option><option value="8a">8a</option><option value="8b">8b</option><option value="9a">9a</option><option value="9b">9b</option>
          </select>
          <label>Tipe:</label>
          <select id="rekap-tipe" onchange="toggleSiswaOption()">
            <option value="kelas">Rekap Seluruhnya (Akumulasi)</option>
            <option value="individu">Rekap Individu</option>
          </select>
        </div>
        <div class="flex-gap" style="margin-top: 10px;">
          <label>Dari Tanggal:</label>
          <input type="date" id="rekap-tgl-awal">
          <label>Sampai Tanggal:</label>
          <input type="date" id="rekap-tgl-akhir">
          <div id="siswa-select-wrapper" style="display: none;">
            <label>Siswa:</label>
            <select id="rekap-siswa"></select>
          </div>
          <button class="btn-class active" onclick="loadRekapData()">Tampilkan Rekap</button>
        </div>
      </div>

      <div class="glass-card" id="rekap-result-card" style="display: none;">
        <div class="print-header">
          <h2>Rekap Presensi UPT SMP NEGERI 3 SUTOJAYAN</h2>
          <h4 id="print-subheader-kelas">Kelas: -</h4>
          <p id="print-subheader-rentang">Periode Rekapitulasi Data</p>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;" class="no-print">
          <h3 style="color: var(--cyan-neon);">Hasil Rekapitulasi</h3>
          <div style="display: flex; gap: 8px;">
            <button id="btn-print" class="btn-action btn-absen" style="padding: 10px 18px;" onclick="window.print()" disabled style="opacity: 0.5; cursor: not-allowed;">Cetak / Simpan PDF</button>
            <button id="btn-send-wa" class="btn-action btn-wa" style="padding: 10px 18px;" onclick="kirimRekapMassalPdf()" disabled style="opacity: 0.5; cursor: not-allowed;">Kirim Rekap PDF ke WA</button>
          </div>
        </div>

        <div id="rekap-summary-stat" class="stat-container"></div>
        <div id="rekap-table-wrapper"></div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCGdnEHgZk-SK1YJzR-KFmTEFTMbABsAPR9uGw7V03yRbuP0Dd2z0BU1xOsCs-V-2E/exec";
    let dataSiswa = [];
    let currentClass = "";
    let autoRefreshTimer = null;
    let currentFilteredData = [];

    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${SCRIPT_URL}?action=getSiswa`)
        .then(res => res.json())
        .then(data => { dataSiswa = data; })
        .catch(err => console.error("Gagal memuat data siswa:", err));
    });

    function switchTab(viewId, btn) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
      if (viewId !== 'input-view' && autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    async function selectClass(kelas, btn) {
      currentClass = kelas;
      if (btn) {
        document.querySelectorAll('.btn-class').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      document.getElementById('class-title').innerText = `Daftar Siswa Kelas ${kelas.toUpperCase()}`;
      await renderDaftarSiswa(kelas);
      
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => {
        if (currentClass) { renderDaftarSiswa(currentClass, true); }
      }, 5000); 
    }

    async function renderDaftarSiswa(kelas, isSilent = false) {
      const listContainer = document.getElementById('student-list');
      if (!isSilent) {
        listContainer.innerHTML = "<p style='text-align: center; color: var(--text-dim); padding: 20px 0;'>Menyinkronkan data presensi...</p>";
      }
      const filtered = dataSiswa.filter(s => s[0] && s[0].toString().trim().toLowerCase() === kelas.toLowerCase());
      if (filtered.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center; color: var(--text-dim); padding: 20px 0;'>Data siswa kelas ini tidak ditemukan.</p>";
        return;
      }
      let presensiHariIni = {};
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getPresensiHariIni`);
        presensiHariIni = await res.json();
      } catch (e) { console.error("Gagal sinkron data presensi hari ini:", e); }

      listContainer.innerHTML = "";
      filtered.forEach(siswa => {
        const nama = siswa[1] ? siswa[1].toString().trim() : "";
        const noWa = siswa[2] ? siswa[2].toString().trim() : "";
        const keyMap = `${kelas.toLowerCase()}_${nama}`;
        
        if (!presensiHariIni[keyMap]) presensiHariIni[keyMap] = { pagi: "", pulang: "" };

        if (window.lokalAbsenCache && window.lokalAbsenCache[keyMap] && !presensiHariIni[keyMap].pagi) {
          presensiHariIni[keyMap].pagi = window.lokalAbsenCache[keyMap];
        }

        if (window.lokalPulangCache && window.lokalPulangCache[keyMap] && !presensiHariIni[keyMap].pulang) {
          presensiHariIni[keyMap].pulang = window.lokalPulangCache[keyMap];
        }

        const dataAbsen = presensiHariIni[keyMap];
        const card = document.createElement('div');
        card.className = 'student-card';

        let pagiHtml = '';
        if (dataAbsen.pagi) {
          pagiHtml = `<button class="btn-action" disabled style="background:#334155; color:#94a3b8;">${dataAbsen.pagi}</button>`;
        } else {
          pagiHtml = `
            <button class="btn-action btn-absen" onclick="prosesAbsen('${nama}', '${noWa}', 'absen', this)">Absen</button>
            <button class="btn-action btn-sakit" onclick="prosesAbsen('${nama}', '${noWa}', 'Sakit', this)">Sakit</button>
            <button class="btn-action btn-ijin" onclick="prosesAbsen('${nama}', '${noWa}', 'Ijin', this)">Ijin</button>
            <button class="btn-action btn-alpa" onclick="prosesAbsen('${nama}', '${noWa}', 'Alpa', this)">Alpa</button>
          `;
        }

        let pulangHtml = '';
        const isHadir = dataAbsen.pagi && dataAbsen.pagi.includes("Hadir");
        if (dataAbsen.pulang) {
          pulangHtml = `<button class="btn-action" disabled style="background:#334155; color:#94a3b8;">${dataAbsen.pulang}</button>`;
        } else if (isHadir) {
          pulangHtml = `<button class="btn-action btn-pulang" onclick="prosesPulang('${nama}', '${noWa}', this)">Pulang</button>`;
        } else {
          pulangHtml = `<button class="btn-action" disabled style="background:#1e293b; color:#475569;">Belum Hadir</button>`;
        }

        card.innerHTML = `
          <div class="student-name">${nama}</div>
          <div class="action-group">
            <div class="action-buttons">${pagiHtml}</div>
            <div class="pulang-action">${pulangHtml}</div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function prosesAbsen(nama, noWa, tipe, btnElement) {
      const now = new Date();
      const jamStr = now.toTimeString().split(' ')[0].substring(0, 5);
      const tanggalStr = now.toISOString().split('T')[0];
      let statusFinal = tipe;
      if (tipe === 'absen') {
        const jam = now.getHours();
        statusFinal = (jam < 7) ? "Hadir Tepat Waktu" : "Hadir Terlambat";
      }

      if (!window.lokalAbsenCache) window.lokalAbsenCache = {};
      window.lokalAbsenCache[`${currentClass.toLowerCase()}_${nama}`] = statusFinal;

      const parentCard = btnElement.closest('.action-buttons');
      parentCard.innerHTML = `<button class="btn-action" disabled style="background:#334155; color:#94a3b8;">${statusFinal}</button>`;
      
      const payload = { action: "absen", kelas: currentClass, nama: nama, noWa: String(noWa), status: statusFinal, tanggal: tanggalStr, jam: jamStr };
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(() => { renderDaftarSiswa(currentClass, true); })
      .catch(err => console.log(err));
    }

    function prosesPulang(nama, noWa, btnElement) {
      const now = new Date();
      const jamStr = now.toTimeString().split(' ')[0].substring(0, 5);
      const tanggalStr = now.toISOString().split('T')[0];
      const statusPulang = "Pulang Tepat Waktu";

      if (!window.lokalPulangCache) window.lokalPulangCache = {};
      window.lokalPulangCache[`${currentClass.toLowerCase()}_${nama}`] = statusPulang;

      const parentDiv = btnElement.closest('.pulang-action');
      parentDiv.innerHTML = `<button class="btn-action" disabled style="background:#334155; color:#94a3b8;">${statusPulang}</button>`;

      const payload = { action: "absen", kelas: currentClass, nama: nama, noWa: String(noWa), status: statusPulang, tanggal: tanggalStr, jam: jamStr };
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(() => { renderDaftarSiswa(currentClass, true); })
      .catch(err => console.log(err));
    }

    function toggleSiswaOption() {
      const tipe = document.getElementById('rekap-tipe').value;
      const wrapper = document.getElementById('siswa-select-wrapper');
      if (tipe === 'individu') {
        wrapper.style.display = 'block';
        populateSiswaDropdown();
      } else {
        wrapper.style.display = 'none';
      }
    }

    function populateSiswaDropdown() {
      const kelas = document.getElementById('rekap-kelas').value;
      const selectSiswa = document.getElementById('rekap-siswa');
      selectSiswa.innerHTML = "";
      const filtered = dataSiswa.filter(s => s[0] && s[0].toString().trim().toLowerCase() === kelas.toLowerCase());
      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s[1]; opt.innerText = s[1];
        selectSiswa.appendChild(opt);
      });
    }

    function formatJamRapi(jamStr) {
      if (!jamStr || jamStr === '-') return '-';
      if (typeof jamStr === 'string' && jamStr.includes('T')) {
        const timePart = jamStr.split('T')[1];
        if (timePart) return timePart.substring(0, 5) + " WIB";
      }
      return jamStr;
    }

    function loadRekapData() {
      const kelas = document.getElementById('rekap-kelas').value;
      const tipe = document.getElementById('rekap-tipe').value;
      const namaSiswa = document.getElementById('rekap-siswa').value;
      const tglAwal = document.getElementById('rekap-tgl-awal').value;
      const tglAkhir = document.getElementById('rekap-tgl-akhir').value;

      if (!tglAwal || !tglAkhir) {
        alert("Silakan pilih rentang tanggal awal dan tanggal akhir terlebih dahulu.");
        return;
      }

      fetch(`${SCRIPT_URL}?action=getRekap`)
        .then(res => res.json())
        .then(data => {
          let filtered = data.filter(d => {
            const matchKelas = d[2] && d[2].toString().toLowerCase() === kelas.toLowerCase();
            const rowDate = d[0];
            const matchDate = rowDate >= tglAwal && rowDate <= tglAkhir;
            return matchKelas && matchDate;
          });

          if (tipe === 'individu') {
            filtered = filtered.filter(d => d[3] && d[3].toString().trim().toLowerCase() === namaSiswa.trim().toLowerCase());
          }

          currentFilteredData = filtered;

          document.getElementById('print-subheader-kelas').innerText = `Kelas: ${kelas.toUpperCase()}` + (tipe === 'individu' ? ` - ${namaSiswa}` : '');
          document.getElementById('print-subheader-rentang').innerText = `Rentang Periode: ${tglAwal} s/d ${tglAkhir}`;

          const btnPrint = document.getElementById('btn-print');
          const btnSendWa = document.getElementById('btn-send-wa');
          btnPrint.disabled = false; btnPrint.style.opacity = "1"; btnPrint.style.cursor = "pointer";
          btnSendWa.disabled = false; btnSendWa.style.opacity = "1"; btnSendWa.style.cursor = "pointer";

          if (tipe === 'kelas') {
            renderRekapAkumulasiKelas(filtered, kelas);
          } else {
            renderRekapIndividu(filtered);
          }
        })
        .catch(err => alert("Gagal memuat rekap: " + err));
    }

    function renderRekapAkumulasiKelas(data, kelas) {
      const wrapper = document.getElementById('rekap-table-wrapper');
      const statContainer = document.getElementById('rekap-summary-stat');
      document.getElementById('rekap-result-card').style.display = 'block';

      const siswaKelas = dataSiswa.filter(s => s[0] && s[0].toString().trim().toLowerCase() === kelas.toLowerCase());
      if (siswaKelas.length === 0) {
        statContainer.innerHTML = "";
        wrapper.innerHTML = "<p style='text-align:center; padding: 20px 0;'>Data siswa kelas ini tidak ditemukan.</p>";
        return;
      }

      let rekapMap = {};
      siswaKelas.forEach(s => {
        const nama = s[1];
        rekapMap[nama] = { tepat: 0, terlambat: 0, sakit: 0, ijin: 0, alpa: 0, pulang: 0, bolos: 0 };
      });

      let tTepat = 0, tTerlambat = 0, tSakit = 0, tIjin = 0, tAlpa = 0, tPulang = 0, tBolos = 0;

      data.forEach(row => {
        const nama = row[3];
        const status = (row[4] || '').toLowerCase();
        if (rekapMap[nama]) {
          if (status.includes('tepat') && !status.includes('pulang')) { rekapMap[nama].tepat++; tTepat++; }
          else if (status.includes('terlambat')) { rekapMap[nama].terlambat++; tTerlambat++; }
          else if (status.includes('sakit')) { rekapMap[nama].sakit++; tSakit++; }
          else if (status.includes('ijin') || status.includes('izin')) { rekapMap[nama].ijin++; tIjin++; }
          else if (status.includes('alpa')) { rekapMap[nama].alpa++; tAlpa++; }
          else if (status.includes('pulang')) { rekapMap[nama].pulang++; tPulang++; }
          else if (status.includes('bolos')) { rekapMap[nama].bolos++; tBolos++; }
        }
      });

      statContainer.innerHTML = `
        <div class="stat-box"><div class="stat-title">Tepat Waktu</div><div class="stat-value" style="color:#10b981;">${tTepat}</div></div>
        <div class="stat-box"><div class="stat-title">Terlambat</div><div class="stat-value" style="color:#f59e0b;">${tTerlambat}</div></div>
        <div class="stat-box"><div class="stat-title">Sakit</div><div class="stat-value" style="color:#eab308;">${tSakit}</div></div>
        <div class="stat-box"><div class="stat-title">Ijin</div><div class="stat-value" style="color:#3b82f6;">${tIjin}</div></div>
        <div class="stat-box"><div class="stat-title">Alpa</div><div class="stat-value" style="color:#ef4444;">${tAlpa}</div></div>
        <div class="stat-box"><div class="stat-title">Pulang</div><div class="stat-value" style="color:#8b5cf6;">${tPulang}</div></div>
        <div class="stat-box"><div class="stat-title">Bolos</div><div class="stat-value" style="color:#ef4444;">${tBolos}</div></div>
      `;

      let html = `
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Siswa</th>
              <th>Tepat Waktu</th>
              <th>Terlambat</th>
              <th>Sakit</th>
              <th>Ijin</th>
              <th>Alpa</th>
              <th>Pulang</th>
              <th>Bolos</th>
            </tr>
          </thead>
          <tbody>
      `;
      let no = 1;
      Object.keys(rekapMap).forEach(nama => {
        const item = rekapMap[nama];
        html += `
          <tr>
            <td>${no++}</td>
            <td><strong>${nama}</strong></td>
            <td>${item.tepat}</td>
            <td>${item.terlambat}</td>
            <td>${item.sakit}</td>
            <td>${item.ijin}</td>
            <td>${item.alpa}</td>
            <td>${item.pulang}</td>
            <td>${item.bolos}</td>
          </tr>
        `;
      });
      html += `</tbody></table>`;
      wrapper.innerHTML = html;
    }

    function renderRekapIndividu(data) {
      const wrapper = document.getElementById('rekap-table-wrapper');
      const statContainer = document.getElementById('rekap-summary-stat');
      document.getElementById('rekap-result-card').style.display = 'block';

      statContainer.innerHTML = "";

      if (data.length === 0) {
        wrapper.innerHTML = "<p style='text-align:center; padding: 20px 0;'>Belum ada data presensi tercatat untuk siswa ini pada rentang tanggal tersebut.</p>";
        return;
      }

      let mapPerTanggal = {};
      data.forEach(row => {
        const tgl = row[0];
        const jam = row[1];
        const kelas = row[2];
        const nama = row[3];
        const status = row[4];

        if (!mapPerTanggal[tgl]) {
          mapPerTanggal[tgl] = { tanggal: tgl, kelas: kelas, nama: nama, pagi: "-", pulang: "-", jamPagi: "-", jamPulang: "-" };
        }

        if (status.includes("Hadir") || status.includes("Sakit") || status.includes("Ijin") || status.includes("Alpa")) {
          mapPerTanggal[tgl].pagi = status;
          mapPerTanggal[tgl].jamPagi = formatJamRapi(jam);
        } else if (status.includes("Pulang") || status.includes("Bolos")) {
          mapPerTanggal[tgl].pulang = status;
          mapPerTanggal[tgl].jamPulang = formatJamRapi(jam);
        }
      });

      let html = `
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Status Pagi</th>
              <th>Jam Pagi</th>
              <th>Status Pulang</th>
              <th>Jam Pulang</th>
            </tr>
          </thead>
          <tbody>
      `;

      Object.keys(mapPerTanggal).sort().forEach(tgl => {
        const item = mapPerTanggal[tgl];
        let statusPulangFinal = item.pulang;
        let jamPulangFinal = item.jamPulang;
        if (item.pagi.includes("Sakit") || item.pagi.includes("Ijin") || item.pagi.includes("Alpa")) {
          statusPulangFinal = "-";
          jamPulangFinal = "-";
        }

        html += `
          <tr>
            <td>${item.tanggal}</td>
            <td><strong>${item.pagi}</strong></td>
            <td>${item.jamPagi}</td>
            <td><strong>${statusPulangFinal}</strong></td>
            <td>${jamPulangFinal}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      wrapper.innerHTML = html;
    }

    function kirimRekapMassalPdf() {
      const kelas = document.getElementById('rekap-kelas').value;
      const tipe = document.getElementById('rekap-tipe').value;
      const namaSiswa = document.getElementById('rekap-siswa').value;

      if (!currentFilteredData || currentFilteredData.length === 0) {
        alert("Tidak ada data rekap untuk dikirim.");
        return;
      }

      const konfirmasiTeks = (tipe === 'individu')
        ? `Kirim file Rekap PDF (pagi & pulang) untuk siswa: ${namaSiswa} ke WhatsApp wali muridnya?`
        : `Kirim file Rekap PDF (pagi & pulang) Kelas ${kelas.toUpperCase()} ke seluruh wali murid via WA?`;

      if (!confirm(konfirmasiTeks)) return;

      const printHeaderHTML = document.querySelector('.print-header').outerHTML;
      const statHTML = document.getElementById('rekap-summary-stat').outerHTML;
      const tableHTML = document.getElementById('rekap-table-wrapper').innerHTML;

      const fullHTMLForPdf = `
        <html>
        <head>
          <style>
            body { font-family: sans-serif; padding: 20px; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
            .print-header h2 { font-size: 18px; margin: 0; }
            .print-header h4 { font-size: 14px; margin: 5px 0; }
            .print-header p { font-size: 12px; margin: 0; }
            .stat-container { display: flex; gap: 8px; margin-bottom: 15px; }
            .stat-box { border: 1px solid #ccc; padding: 6px; text-align: center; flex: 1; }
            table { width: 100%; border-collapse: collapse; margin-top: 15px; }
            th, td { border: 1px solid #000; padding: 6px; font-size: 11px; text-align: left; }
            th { background-color: #f1f5f9; }
          </style>
        </head>
        <body>
          ${printHeaderHTML}
          ${statHTML}
          ${tableHTML}
        </body>
        </html>
      `;

      const payload = {
        action: "kirimRekapMassalPdf",
        kelas: kelas,
        tipe: tipe,
        namaSiswa: namaSiswa,
        htmlContent: fullHTMLForPdf
      };

      alert("Prosedur pengiriman PDF sedang diproses. Mohon tunggu sejenak...");

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message || "Proses pengiriman selesai.");
      })
      .catch(err => alert("Gagal mengirim rekap PDF: " + err));
    }
  </script>
